[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-onyrix"
version = "0.1.0"
description = "Self-hosted AI MIDI composer"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "mido>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx2",  # required by fastapi.testclient (starlette)
]
inference = [
    "midigpt[inference]",
    "torch",
]

[project.scripts]
onyrix = "app.main:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["mido.*", "midigpt.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not inference'"
markers = [
    "inference: needs model weights (downloads on first run); skipped by default",
]
